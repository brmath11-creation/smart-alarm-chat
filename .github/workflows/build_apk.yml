STREAMING_CHUNK:Configuring workflow triggers and environment...

name: Build Android APK

on:
push:
branches: [ "main" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4

STREAMING_CHUNK:Preparing Flutter SDK and Java runtime...

  - name: Setup Java JDK
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Flutter SDK
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'
      cache: true


STREAMING_CHUNK:Managing Android manifest backup and project generation...

  - name: Backup Custom AndroidManifest
    run: |
      mkdir -p /tmp/manifest_backup
      if [ -f android/app/src/main/AndroidManifest.xml ]; then
        cp android/app/src/main/AndroidManifest.xml /tmp/manifest_backup/AndroidManifest.xml
      fi

  - name: Inisialisasi Kerangka Android Lengkap
    run: |
      flutter create --platforms=android --org com.smartalarm.app .

  - name: Restore Custom AndroidManifest
    run: |
      if [ -f /tmp/manifest_backup/AndroidManifest.xml ]; then
        cp /tmp/manifest_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      fi

  - name: Pasang Modul dan Dependencies
    run: |
      flutter pub get


STREAMING_CHUNK:Compiling release APK and uploading artifact...

  - name: Kompilasi APK Release
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

  - name: Upload Artifact APK
    uses: actions/upload-artifact@v4
    with:
      name: smart-alarm-apk
      path: build/app/outputs/flutter-apk/app-release.apk
