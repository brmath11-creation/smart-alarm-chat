name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Clean Android Structure
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Inject Android Permissions
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          perms = """
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          content = content.replace("<manifest", "<manifest" + perms, 1)
          content = content.replace("<activity", '<activity android:showWhenLocked="true" android:turnScreenOn="true" android:keepScreenOn="true"', 1)

          with open(manifest_path, "w") as f:
              f.write(content)
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
