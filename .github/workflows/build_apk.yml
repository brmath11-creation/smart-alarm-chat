name: Build Android APK

on:
push:
branches: [ "main" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4

  - name: Setup Java JDK
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Flutter SDK
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'
      cache: true

  <!-- STREAMING_CHUNK:Generating missing Android Gradle scaffolding automatically... -->
  - name: Inisialisasi Kerangka Android Lengkap
    run: |
      flutter create --platforms=android --org com.smartalarm.app .

  - name: Pasang Modul dan Dependencies
    run: |
      flutter pub get

  <!-- STREAMING_CHUNK:Compiling release APK with environment secrets... -->
  - name: Kompilasi APK Release
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

  <!-- STREAMING_CHUNK:Uploading APK Artifact for direct download... -->
  - name: Upload Artifact APK
    uses: actions/upload-artifact@v4
    with:
      name: smart-alarm-apk
      path: build/app/outputs/flutter-apk/app-release.apk
