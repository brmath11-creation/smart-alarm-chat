name: Build Android APK

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]
workflow_dispatch:

permissions:
contents: write

jobs:
build:
name: Build Release APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Source Code
    uses: actions/checkout@v4

  - name: Set up Java JDK
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'
      cache: 'gradle'

  - name: Set up Flutter Environment
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.x'
      channel: 'stable'
      cache: true

  - name: Fetch Dependencies
    run: flutter pub get

  # Membuat struktur native Android otomatis jika repositori baru berisi folder Dart
  - name: Generate Android Native Scaffold
    run: |
      if [ ! -d "android" ]; then
        echo "Membuat struktur folder native Android secara otomatis..."
        flutter create . --platforms=android --org com.pakbagas.smartalarm
      fi

  # Konfigurasi izin Android Manifest lengkap untuk Alarm, Layar Kunci, Getar, dan Mikrofon
  - name: Inject Android Manifest and Permissions
    run: |
      cat << 'EOF' > android/app/src/main/AndroidManifest.xml
      <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          xmlns:tools="http://schemas.android.com/tools"
          package="com.pakbagas.smartalarm">

          <!-- Izin Operasi Alarm Sistem & Audio Perangkat Keras -->
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <uses-permission android:name="android.permission.WAKE_LOCK" />
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
          <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
          <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

          <!-- Query deklarasi Google Speech Recognizer untuk Android 11 ke atas -->
          <queries>
              <intent>
                  <action android:name="android.speech.RecognitionService" />
              </intent>
          </queries>

          <application
              android:label="Smart Alarm"
              android:name="${applicationName}"
              android:icon="@mipmap/ic_launcher"
              android:showWhenLocked="true"
              android:turnScreenOn="true">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTop"
                  android:theme="@style/LaunchTheme"
                  android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                  android:hardwareAccelerated="true"
                  android:windowSoftInputMode="adjustResize"
                  android:showWhenLocked="true"
                  android:turnScreenOn="true"
                  android:showForAllUsers="true">
                  <meta-data
                    android:name="io.flutter.embedding.android.NormalTheme"
                    android:resource="@style/NormalTheme"
                    />
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
              <meta-data
                  android:name="flutterEmbedding"
                  android:value="2" />
          </application>
      </manifest>
      EOF

  # Penyesuaian versi Android SDK agar kompatibel dengan modul audio & wakelock modern
  - name: Adjust Android SDK Compile Version
    run: |
      sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
      sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true

  # Kompilasi APK rilis dengan argumen API Key
  - name: Build Android Release APK
    run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

  # Unggah hasil kompilasi APK ke GitHub Actions Artifacts
  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: release-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      retention-days: 14
