name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Clean Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name smart_alarm --org com.smartalarm.pakbagas

      - name: Configure Android Permissions and WakeLock
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          content = content.replace(">", ">" + permissions, 1)

          activity_attrs = 'android:showWhenLocked="true" android:turnScreenOn="true" android:keepScreenOn="true"'
          content = content.replace("<activity", f"<activity {activity_attrs}", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Configure Gradle Settings
        run: |
          build_gradle="android/app/build.gradle"
          if [ -f "$build_gradle" ]; then
            sed -i '/android {/a \    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }' "$build_gradle"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-alarm-apk
          path: build/app/outputs/flutter-apk/*.apk
