name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inisialisasi Android Scaffold Otomatis
        run: |
          flutter create --platforms=android --org com.smartalarm.app .

      - name: Pasang Modul dan Dependencies
        run: flutter pub get

      - name: Kompilasi APK (Release Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAlarm-App
          path: build/app/outputs/flutter-apk/app-release.apk